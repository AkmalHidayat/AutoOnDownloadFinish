appId: com.akmal.autoondownloadfinish
productName: AutoOnDownloadFinish
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AutoOnDownloadFinish
